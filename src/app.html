<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0908" />
    <link rel="icon" href="%sveltekit.assets%/images/abs-medaille.webp" type="image/webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Newsreader (léger) pour les titres, Jost pour le texte : sobre, éditorial -->
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..500;1,6..72,300..500&family=Jost:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      document.documentElement.classList.add('js');
    </script>
    <noscript><style>html{overflow:auto!important}.loader{display:none!important}</style></noscript>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
